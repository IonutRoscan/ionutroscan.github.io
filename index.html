<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOCTURNE CODEX // TACTILE ROTARY ARCHIVE</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="codex.css">
</head>
<body>
  <div class="codex-chassis">
    <!-- Master Header Deck -->
    <header class="codex-header">
      <div class="brand-emblem">
        <div class="emblem-core">NX</div>
        <div class="emblem-title">NOCTURNE // CODEX MECHANICAL DECK</div>
      </div>
      <div class="header-telemetry">
        <span class="telemetry-tag">RECORDS: <strong id="dial-count">00</strong></span>
        <button class="chassis-btn" id="audio-toggle" type="button" aria-pressed="true">ACOUSTICS [ON]</button>
      </div>
    </header>

    <!-- Main Mechanical Deck -->
    <main class="codex-deck">
      <!-- Left: Rotary Drum Selector -->
      <aside class="rotary-bay" aria-label="Rotary Selector">
        <div class="rotary-controls">
          <input type="search" id="codex-search" class="codex-input" placeholder="SEEK IDENTIFIER / TAG..." autocomplete="off" spellcheck="false">
        </div>
        <div class="rotary-stage" id="rotary-stage">
          <div class="rotary-reticle"></div>
          <div class="rotary-track" id="rotary-track"></div>
        </div>
      </aside>

      <!-- Right: Pneumatic Cassette Carrier Chamber -->
      <section class="carrier-chamber" id="bay-mount" aria-label="Cartridge Bay"></section>
    </main>

    <!-- Lower Status Deck -->
    <footer class="codex-footer">
      <div class="status-indicator">
        <span id="codex-status">INITIALIZING SYSTEM CHASSIS...</span>
      </div>
      <div class="telemetry-meta">
        <span>INTERACTION: SCROLL / DRAG DIAL · KEYS: [W/S] OR [UP/DOWN]</span>
      </div>
    </footer>
  </div>

  <!-- Mechanical Engine Modules -->
  <script src="audio-feedback.js"></script>
  <script src="rotary-engine.js"></script>
  <script src="cassette-loader.js"></script>
  <script src="codex-app.js"></script>
</body>
</html>
